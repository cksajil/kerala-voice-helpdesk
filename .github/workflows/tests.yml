name: tests
# Unit tests on every push and pull request. CPU only, no model: the tests run the helpdesk with the
# LLM off and mock the weather and news calls. Same pinned packages as the Docker image.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt pytest==8.4.2 httpx==0.28.1
      - run: python -m pytest -q tests
